<svg
  viewBox="0 0 720 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Three-panel diagram of a graft union forming over time: cut faces apart at day 0, callus bridging across days 2 to 7, and vascular connection made across days 7 to 14."
>
  <title>Graft union stages, day 0 to day 14</title>

  <rect x="1" y="1" width="718" height="198" fill="none" stroke="#DCE2DF" stroke-width="1" />
  <line x1="240" y1="1" x2="240" y2="199" stroke="#DCE2DF" stroke-width="1" />
  <line x1="480" y1="1" x2="480" y2="199" stroke="#DCE2DF" stroke-width="1" />

  <!-- Panel 1: cut faces apart -->
  <g>
    <polygon points="106,20 134,20 134,64 106,72" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <polygon points="106,96 134,88 134,150 106,150" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <text x="120" y="168" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.08em" fill="#68716E">CUT FACES APART</text>
    <text x="120" y="190" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#E0521F">DAY 0</text>
  </g>

  <!-- Panel 2: callus bridging -->
  <g>
    <ellipse cx="360" cy="79" rx="19" ry="16" fill="#DCE2DF" stroke="#68716E" stroke-width="1.25" />
    <polygon points="346,20 374,20 374,60 346,68" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <polygon points="346,80 374,72 374,150 346,150" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <text x="360" y="168" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.08em" fill="#68716E">CALLUS BRIDGING</text>
    <text x="360" y="190" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#E0521F">DAYS 2–7</text>
  </g>

  <!-- Panel 3: vascular connection made -->
  <g>
    <rect x="586" y="20" width="28" height="130" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <line x1="586" y1="79" x2="614" y2="79" stroke="#68716E" stroke-width="1" stroke-dasharray="2,2" />
    <line x1="600" y1="30" x2="600" y2="140" stroke="#0E1211" stroke-width="1" stroke-dasharray="1,3" />
    <text x="600" y="168" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9.5" letter-spacing="0.08em" fill="#68716E">VASCULAR CONNECTION MADE</text>
    <text x="600" y="190" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.04em" fill="#E0521F">DAYS 7–14</text>
  </g>
</svg>
