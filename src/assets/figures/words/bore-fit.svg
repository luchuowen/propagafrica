<svg
  viewBox="0 0 720 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Three sleeves in section over the same stem: over-size showing a gap, correct fit, and under-size showing compression."
>
  <title>Sleeve bore fit in section: over-size, correct, under-size</title>

  <rect x="1" y="1" width="718" height="198" fill="none" stroke="#DCE2DF" stroke-width="1" />
  <line x1="240" y1="1" x2="240" y2="199" stroke="#DCE2DF" stroke-width="1" />
  <line x1="480" y1="1" x2="480" y2="199" stroke="#DCE2DF" stroke-width="1" />

  <!-- Panel 1: over-size -->
  <g>
    <circle cx="120" cy="85" r="55" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <circle cx="120" cy="85" r="28" fill="#DCE2DF" stroke="#68716E" stroke-width="1.25" />
    <line x1="148" y1="85" x2="175" y2="85" stroke="#E0521F" stroke-width="1.25" />
    <line x1="148" y1="79" x2="148" y2="91" stroke="#E0521F" stroke-width="1.25" />
    <line x1="175" y1="79" x2="175" y2="91" stroke="#E0521F" stroke-width="1.25" />
    <text x="181" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.04em" fill="#E0521F">GAP</text>
    <text x="120" y="172" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.08em" fill="#68716E">OVER-SIZE</text>
  </g>

  <!-- Panel 2: correct -->
  <g>
    <circle cx="360" cy="85" r="55" fill="#FFFFFF" stroke="#0E1211" stroke-width="1.5" />
    <circle cx="360" cy="85" r="50" fill="#DCE2DF" stroke="#68716E" stroke-width="1.25" />
    <line x1="410" y1="85" x2="415" y2="85" stroke="#E0521F" stroke-width="1.25" />
    <line x1="410" y1="80" x2="410" y2="90" stroke="#E0521F" stroke-width="1.25" />
    <line x1="415" y1="80" x2="415" y2="90" stroke="#E0521F" stroke-width="1.25" />
    <text x="421" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.02em" fill="#E0521F">± 0.15 mm</text>
    <text x="360" y="172" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.08em" fill="#68716E">CORRECT</text>
  </g>

  <!-- Panel 3: under-size -->
  <g>
    <circle cx="600" cy="85" r="54" fill="#DCE2DF" stroke="#68716E" stroke-width="1.25" />
    <circle cx="600" cy="85" r="50" fill="none" stroke="#0E1211" stroke-width="1.5" stroke-dasharray="4,2" />
    <line x1="650" y1="85" x2="654" y2="85" stroke="#E0521F" stroke-width="1.25" />
    <line x1="650" y1="79" x2="650" y2="91" stroke="#E0521F" stroke-width="1.25" />
    <line x1="654" y1="79" x2="654" y2="91" stroke="#E0521F" stroke-width="1.25" />
    <text x="660" y="82" font-family="JetBrains Mono, ui-monospace, monospace" font-size="9" letter-spacing="0.02em" fill="#E0521F">COMPRESSION</text>
    <text x="600" y="172" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="10" letter-spacing="0.08em" fill="#68716E">UNDER-SIZE</text>
  </g>
</svg>
