<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 560 220"
  role="img"
  aria-label="The traceability chain an auditor walks: mother block, then tray label, then batch card, then QC logbook, then despatch record, each linked by an arrow. A band beneath shows one lot code running through all five links, with a dashed leader marked supplier batch on every item."
>
  <g font-family="var(--f-mono)" font-size="11" fill="var(--ink)">
    <!-- Five nodes, evenly spaced with room for an arrow between each -->
    <g stroke="var(--ink)" stroke-width="1.5" fill="var(--green)" fill-opacity="0.06">
      <rect x="20" y="30" width="84" height="46" />
      <rect x="134" y="30" width="84" height="46" />
      <rect x="248" y="30" width="84" height="46" />
      <rect x="362" y="30" width="84" height="46" />
      <rect x="476" y="30" width="64" height="46" />
    </g>
    <text x="30" y="58">MOTHER</text>
    <text x="30" y="70">BLOCK</text>
    <text x="146" y="58">TRAY</text>
    <text x="146" y="70">LABEL</text>
    <text x="258" y="58">BATCH</text>
    <text x="258" y="70">CARD</text>
    <text x="372" y="58">QC</text>
    <text x="372" y="70">LOGBOOK</text>
    <text x="486" y="58">DESPATCH</text>

    <!-- Arrows, left to right -->
    <g stroke="var(--ink)" stroke-width="1.5">
      <line x1="104" y1="53" x2="130" y2="53" />
      <path d="M 123 47 L 130 53 L 123 59" fill="none" />
      <line x1="218" y1="53" x2="244" y2="53" />
      <path d="M 237 47 L 244 53 L 237 59" fill="none" />
      <line x1="332" y1="53" x2="358" y2="53" />
      <path d="M 351 47 L 358 53 L 351 59" fill="none" />
      <line x1="446" y1="53" x2="472" y2="53" />
      <path d="M 465 47 L 472 53 L 465 59" fill="none" />
    </g>
  </g>

  <!-- Lot code band -->
  <rect
    x="20"
    y="120"
    width="520"
    height="26"
    fill="var(--signal)"
    fill-opacity="0.1"
    stroke="var(--signal)"
    stroke-width="1"
  />
  <text x="30" y="137" font-family="var(--f-mono)" font-size="12" fill="var(--signal-ink)">
    LOT 24-0917-A — RUNS THROUGH ALL FIVE
  </text>

  <!-- Dashed leader -->
  <path d="M 70 120 L 70 176" fill="none" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4 4" />
  <text x="30" y="196" font-family="var(--f-mono)" font-size="12" fill="var(--ink-soft)">
    SUPPLIER BATCH ON EVERY ITEM
  </text>
</svg>
