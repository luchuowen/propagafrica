<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 440 260"
  role="img"
  aria-label="Section through a 128-cell propagation tray showing two cells in cross-section. Each cell is filled with growing medium to within 6 millimetres of the rim, leaving a 6 millimetre headspace dimensioned in orange, with drainage slots at the base and an annotation reading approximately 20 millilitres per cell."
>
  <g fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-linejoin="round">
    <!-- Sheet baseline -->
    <line x1="20" y1="230" x2="420" y2="230" stroke="var(--rule)" stroke-width="1" />

    <!-- Cell 1 -->
    <path d="M 60 40 L 150 40 L 128 190 L 82 190 Z" fill="var(--green)" fill-opacity="0.08" />
    <!-- Drainage slot -->
    <path d="M 100 190 L 110 200 L 100 210" />
    <!-- Cell 2 -->
    <path d="M 210 40 L 300 40 L 278 190 L 232 190 Z" fill="var(--green)" fill-opacity="0.08" />
    <path d="M 250 190 L 260 200 L 250 210" />

    <!-- Fill line inside each cell, 98mm from rim -->
    <line x1="63" y1="58" x2="147" y2="58" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" />
    <line x1="213" y1="58" x2="297" y2="58" stroke="var(--ink)" stroke-width="1" stroke-dasharray="3 3" />
  </g>

  <!-- Headspace dimension, cell 1 -->
  <g stroke="var(--signal)" stroke-width="1" fill="none">
    <line x1="170" y1="40" x2="170" y2="58" />
    <line x1="165" y1="40" x2="175" y2="40" />
    <line x1="165" y1="58" x2="175" y2="58" />
  </g>
  <text x="178" y="52" font-family="var(--f-mono)" font-size="12" fill="var(--signal)">6 mm</text>

  <!-- Fill depth dimension, cell 2 -->
  <g stroke="var(--signal)" stroke-width="1" fill="none">
    <line x1="320" y1="58" x2="320" y2="190" />
    <line x1="315" y1="58" x2="325" y2="58" />
    <line x1="315" y1="190" x2="325" y2="190" />
  </g>
  <text x="328" y="128" font-family="var(--f-mono)" font-size="12" fill="var(--signal)">98 mm</text>

  <!-- Annotation -->
  <text x="60" y="245" font-family="var(--f-mono)" font-size="13" fill="var(--signal)">
    ≈ 20 ml / cell
  </text>
</svg>
