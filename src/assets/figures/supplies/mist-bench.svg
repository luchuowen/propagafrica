<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 480 300"
  role="img"
  aria-label="Elevation of a mist propagation bench at 1 to 20 scale. Three trays sit on the bench beneath an overhead mist line carrying three nozzles, each drawn with its spray cone, with the nozzle pitch of 1.1 metres dimensioned in orange. A sensor is drawn at canopy height with a leader line, and a dashed control loop runs from the sensor back to the mist valve."
>
  <!-- Bench -->
  <g fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linejoin="round">
    <line x1="40" y1="240" x2="440" y2="240" />
    <line x1="60" y1="240" x2="60" y2="270" />
    <line x1="420" y1="240" x2="420" y2="270" />
    <line x1="60" y1="270" x2="420" y2="270" />
  </g>

  <!-- Trays -->
  <g fill="var(--green)" fill-opacity="0.08" stroke="var(--ink)" stroke-width="1.25">
    <rect x="70" y="222" width="100" height="18" />
    <rect x="190" y="222" width="100" height="18" />
    <rect x="310" y="222" width="100" height="18" />
  </g>

  <!-- Mist line -->
  <line x1="40" y1="60" x2="440" y2="60" stroke="var(--ink)" stroke-width="1.75" />

  <!-- Nozzles and spray cones -->
  <g stroke="var(--ink)" stroke-width="1.25" fill="none">
    <g>
      <line x1="120" y1="60" x2="120" y2="72" />
      <path d="M 96 130 L 120 72 L 144 130" />
    </g>
    <g>
      <line x1="240" y1="60" x2="240" y2="72" />
      <path d="M 216 130 L 240 72 L 264 130" />
    </g>
    <g>
      <line x1="360" y1="60" x2="360" y2="72" />
      <path d="M 336 130 L 360 72 L 384 130" />
    </g>
  </g>

  <!-- Nozzle pitch dimension -->
  <g stroke="var(--signal)" stroke-width="1" fill="none">
    <line x1="120" y1="40" x2="240" y2="40" />
    <line x1="120" y1="35" x2="120" y2="45" />
    <line x1="240" y1="35" x2="240" y2="45" />
  </g>
  <text x="150" y="30" font-family="var(--f-mono)" font-size="13" fill="var(--signal-ink)">1.1 m pitch</text>

  <!-- Sensor at canopy height -->
  <circle cx="240" cy="160" r="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.5" />
  <line x1="246" y1="160" x2="300" y2="145" stroke="var(--ink-soft)" stroke-width="1" />
  <text x="304" y="149" font-family="var(--f-mono)" font-size="12" fill="var(--ink-soft)">
    SENSOR, CANOPY HEIGHT
  </text>

  <!-- Control loop, sensor back to valve -->
  <path
    d="M 234 154 C 150 110 90 90 70 62"
    fill="none"
    stroke="var(--ink-soft)"
    stroke-width="1"
    stroke-dasharray="4 4"
  />
  <circle cx="66" cy="60" r="5" fill="none" stroke="var(--ink)" stroke-width="1.5" />
  <text x="20" y="45" font-family="var(--f-mono)" font-size="12" fill="var(--ink-soft)">VALVE</text>
</svg>
