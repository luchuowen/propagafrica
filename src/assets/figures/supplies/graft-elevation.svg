<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 440 320"
  role="img"
  aria-label="Elevation of a splice graft join at two-to-one scale. The scion stem sits above the rootstock stem, both cut at a matching 30 degree angle and pressed together, with a transparent silicone sleeve wrapped over the join. The sleeve bore, sleeve length and cut angle are dimensioned in orange, and leader lines label the scion, the sleeve and the rootstock."
>
  <g fill="none" stroke="var(--ink)" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round">
    <!-- Scion, above -->
    <line x1="220" y1="20" x2="220" y2="130" />
    <!-- Rootstock, below -->
    <line x1="220" y1="190" x2="220" y2="300" />
    <!-- Cut faces at 30 degrees, meeting mid-sleeve -->
    <line x1="205" y1="132" x2="235" y2="128" stroke="var(--signal)" stroke-width="1.5" />
    <line x1="205" y1="192" x2="235" y2="188" stroke="var(--signal)" stroke-width="1.5" />
  </g>

  <!-- Sleeve -->
  <rect
    x="188"
    y="118"
    width="64"
    height="82"
    fill="var(--green)"
    fill-opacity="0.1"
    stroke="var(--green)"
    stroke-width="1.75"
  />

  <!-- Bore dimension -->
  <g stroke="var(--signal)" stroke-width="1" fill="none">
    <line x1="188" y1="90" x2="252" y2="90" />
    <line x1="188" y1="85" x2="188" y2="95" />
    <line x1="252" y1="85" x2="252" y2="95" />
  </g>
  <text x="196" y="80" font-family="var(--f-mono)" font-size="13" fill="var(--signal-ink)">4.5 mm bore</text>

  <!-- Sleeve length dimension -->
  <g stroke="var(--signal)" stroke-width="1" fill="none">
    <line x1="270" y1="118" x2="270" y2="200" />
    <line x1="265" y1="118" x2="275" y2="118" />
    <line x1="265" y1="200" x2="275" y2="200" />
  </g>
  <text x="278" y="163" font-family="var(--f-mono)" font-size="13" fill="var(--signal-ink)">20 mm</text>

  <!-- Cut angle annotation -->
  <text x="90" y="164" font-family="var(--f-mono)" font-size="13" fill="var(--signal-ink)">30°</text>
  <path d="M 110 150 A 26 26 0 0 1 110 178" fill="none" stroke="var(--signal)" stroke-width="1" />

  <!-- Leaders and labels -->
  <g font-family="var(--f-mono)" font-size="12" fill="var(--ink-soft)">
    <line x1="220" y1="45" x2="330" y2="45" stroke="var(--ink-soft)" stroke-width="1" />
    <text x="334" y="49">SCION</text>

    <line x1="252" y1="159" x2="330" y2="159" stroke="var(--ink-soft)" stroke-width="1" />
    <text x="334" y="163">SLEEVE</text>

    <line x1="220" y1="275" x2="330" y2="275" stroke="var(--ink-soft)" stroke-width="1" />
    <text x="334" y="279">ROOTSTOCK</text>
  </g>
</svg>
